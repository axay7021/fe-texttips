name: Next.js CI/CD for Development Branch [Text Tips]

on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: fe-texttips prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Enable Corepack
        run: corepack enable

      - name: Add Envrionemnt Variables
        run: cp /home/ankit/projects/fe-texttips-prod/.env .env

      - name: Install Dependencies
        run: pnpm install

      - name: Build Application
        run: pnpm run build

      # - name: Restart Application with PM2
      #   run: pm2 restart fe-texttips-dev
